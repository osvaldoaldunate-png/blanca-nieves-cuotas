<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#be185d">
<title>Pagar Cuota · Escuela de Lenguaje Blanca Nieves</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

<style>
:root{
  --pink:#be185d;
  --pink2:#ec4899;
  --green:#16803a;
  --red:#d92d20;
  --bg:#fff8fc;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --border:#eadbe6;
  --amber:#b54708
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:linear-gradient(#fff,var(--bg));
  color:var(--text)
}

button,input{font:inherit}

.wrap{
  width:min(760px,calc(100% - 24px));
  margin:auto;
  padding:18px 0 50px
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px
}

.brand{text-align:center}

.logo{
  width:115px;
  height:115px;
  object-fit:contain;
  border-radius:18px
}

.eyebrow{
  color:var(--pink);
  font-size:12px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase
}

h1{margin:7px 0 4px;font-size:30px}
h2{margin:0 0 10px}

.sub,.help{
  color:var(--muted);
  font-size:14px;
  line-height:1.45
}

.notice{
  margin-top:14px;
  border-radius:14px;
  padding:12px 13px;
  background:#fff4f8;
  border:1px solid #f5c5dc;
  font-size:13px
}

.transfer{
  margin-top:12px;
  border-radius:16px;
  padding:14px;
  background:#f8fafc;
  border:1px solid #dce3ea
}

.transferRow{
  display:grid;
  grid-template-columns:130px 1fr;
  gap:8px;
  padding:6px 0;
  border-bottom:1px dashed #d8dee6
}

.transferRow:last-child{border-bottom:0}

.transferKey{
  color:var(--muted);
  font-size:13px
}

.transferVal{
  font-weight:800;
  word-break:break-word
}

label{
  display:block;
  font-size:13px;
  font-weight:800
}

input{
  width:100%;
  margin-top:6px;
  padding:14px 13px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  text-transform:uppercase
}

input[type=file]{
  text-transform:none;
  background:#fff
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  padding:12px 15px;
  font-weight:850;
  cursor:pointer;
  color:var(--text)
}

.primary{
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:#fff;
  border:0
}

.green{
  background:var(--green);
  color:#fff;
  border:0
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

.actions .btn{flex:1}

.hidden{display:none!important}

.student{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px
}

.amount{
  font-size:22px;
  font-weight:900
}

.course{
  color:var(--muted);
  font-size:13px
}

.months{
  display:grid;
  gap:8px;
  margin-top:14px
}

.month{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px
}

.month input{
